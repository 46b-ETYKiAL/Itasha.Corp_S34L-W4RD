# gitleaks configuration for SealWard (S34L-W4RD)
# ---------------------------------------------------------------------------
# Tuned for CODE-SIGNING secrets. Extends the gitleaks default rule pack
# (`useDefault = true` pulls in the built-in detectors for AWS/GCP/Azure
# keys, generic API tokens, private-key PEM blocks, etc.) and ADDS custom
# rules for the signing-specific secret shapes the defaults miss: Apple .p8
# keys, keystore/MATCH passwords, and PKCS#11 PINs.
#
# Run modes (all three are wired in the four-layer defense):
#   gitleaks protect --staged   # pre-commit
#   gitleaks protect            # pre-push (unstaged + staged)
#   gitleaks detect             # CI full-history scan
#   gitleaks detect --no-git    # scan a working dir / fixture tree
# Any finding exits non-zero and HARD-BLOCKS the commit/push/publish.

title = "SealWard secret-scan ruleset"

[extend]
# Pull in the full gitleaks default rule pack, then add the rules below.
useDefault = true

# ---------------------------------------------------------------------------
# Custom rules — signing-specific secret shapes
# ---------------------------------------------------------------------------

[[rules]]
id = "apple-app-store-connect-p8-key"
description = "Apple App Store Connect API key (.p8 PKCS#8 EC private key)"
regex = '''-----BEGIN PRIVATE KEY-----[\s\S]{0,200}MIGT[\s\S]+?-----END PRIVATE KEY-----'''
keywords = ["BEGIN PRIVATE KEY"]
tags = ["apple", "private-key", "code-signing"]

[[rules]]
id = "pkcs1-rsa-private-key"
description = "PKCS#1 RSA private key block"
regex = '''-----BEGIN RSA PRIVATE KEY-----'''
keywords = ["BEGIN RSA PRIVATE KEY"]
tags = ["private-key"]

[[rules]]
id = "ec-private-key"
description = "EC private key block"
regex = '''-----BEGIN EC PRIVATE KEY-----'''
keywords = ["BEGIN EC PRIVATE KEY"]
tags = ["private-key"]

[[rules]]
id = "openssh-private-key"
description = "OpenSSH private key block"
regex = '''-----BEGIN OPENSSH PRIVATE KEY-----'''
keywords = ["BEGIN OPENSSH PRIVATE KEY"]
tags = ["private-key", "ssh"]

[[rules]]
id = "pgp-private-key"
description = "PGP/GPG private key block"
regex = '''-----BEGIN PGP PRIVATE KEY BLOCK-----'''
keywords = ["BEGIN PGP PRIVATE KEY"]
tags = ["private-key", "gpg"]

[[rules]]
id = "fastlane-match-password"
description = "Fastlane MATCH_PASSWORD (decrypts the iOS cert/profile repo)"
regex = '''(?i)\bMATCH_PASSWORD\b\s*[:=]\s*['"]?[^\s'"#]{4,}'''
keywords = ["MATCH_PASSWORD"]
tags = ["apple", "ios", "password", "code-signing"]

[[rules]]
id = "android-keystore-password"
description = "Android keystore / key password assignment (literal VALUE, not a name-read)"
# Case-SENSITIVE on the env-var NAME: a real leak is an UPPERCASE env-style
# assignment to a literal (KEYSTORE_PASSWORD=hunter2). A lowercase Python
# identifier (`keystore_password = os.environ.get(...)`, `keystore_password: str`)
# is a name-read / annotation that carries NO value — the BYO-key design reads
# the secret by name and never inlines it, so those must not trip the scanner.
# Matching is case-SENSITIVE (UPPERCASE env-var name) so lowercase Python
# identifiers never trip it. The RHS must be a literal token (RE2 has no
# lookahead); the env-var-name allowlist regex below additionally clears any
# `NAME = os.environ.get(...)` name-read that uses the uppercase constant.
regex = '''\b(KEYSTORE_PASSWORD|KEY_PASSWORD|STOREPASS|KEYPASS|SIGNING_STORE_PASSWORD|SIGNING_KEY_PASSWORD)\b\s*=\s*['"]?[^\s'"#]{4,}'''
keywords = ["KEYSTORE_PASSWORD", "STOREPASS", "KEYPASS", "SIGNING_STORE_PASSWORD", "SIGNING_KEY_PASSWORD"]
tags = ["android", "password", "code-signing"]

[[rules]]
id = "pkcs12-pfx-passphrase"
description = "PKCS#12 / PFX import passphrase assignment"
regex = '''(?i)\b(P12_PASSWORD|PFX_PASSWORD|CERT_PASSWORD|CERTIFICATE_PASSWORD|PKCS12_PASSWORD)\b\s*[:=]\s*['"]?[^\s'"#]{4,}'''
keywords = ["P12_PASSWORD", "PFX_PASSWORD", "CERT_PASSWORD", "CERTIFICATE_PASSWORD", "PKCS12_PASSWORD"]
tags = ["password", "code-signing"]

[[rules]]
id = "pkcs11-token-pin"
description = "PKCS#11 / HSM token PIN assignment"
regex = '''(?i)\b(PKCS11_PIN|TOKEN_PIN|HSM_PIN|SLOT_PIN)\b\s*[:=]\s*['"]?[^\s'"#]{4,}'''
keywords = ["PKCS11_PIN", "TOKEN_PIN", "HSM_PIN", "SLOT_PIN"]
tags = ["hsm", "pkcs11", "pin", "code-signing"]

# ---------------------------------------------------------------------------
# Allowlist — documentation / example HANDLES are NOT secrets.
# Handles (URIs/ARNs/slot labels) are exactly what SealWard is designed to
# reference publicly, so example handle strings must not trip the scanner.
# ---------------------------------------------------------------------------
[allowlist]
description = "Allow example HANDLE/URI references, env-var NAME reads, and FAKE test fixtures"
regexes = [
    # Example handle shapes that are SAFE to publish (no secret value).
    '''pkcs11:slot=\d+;object=[A-Za-z0-9_-]+''',
    '''arn:aws:kms:[a-z0-9-]+:\d+:key/[0-9a-f-]+''',
    '''https://[a-z0-9-]+\.vault\.azure\.net/keys/[A-Za-z0-9_-]+''',
    '''projects/[A-Za-z0-9_-]+/locations/[a-z0-9-]+/keyRings/[A-Za-z0-9_-]+/cryptoKeys/[A-Za-z0-9_-]+''',
    # Reading a secret by ENV-VAR NAME is the whole point of the BYO-key design —
    # `password = os.environ.get(NAME)` carries no value and is SAFE to publish.
    # Also covers Python local-variable / parameter / docstring references to the
    # NAME of a password (e.g. `keystore_password: str`, `key_password = ...`).
    '''(?i)\b\w*(?:keystore|key|store|match|cert|p12|pfx)_?password\b\s*[:=].*(?:os\.environ|str|: ?str|<literal|\.\.\.|env:|getenv)''',
    # Test fixtures deliberately plant FAKE secret-shaped values to PROVE the
    # scrub gate BLOCKS them — these are not real secrets. The literal markers
    # "fake"/"FAKE"/"hunter2"/"totally-fake" identify them unambiguously.
    '''(?i)(fake|hunter2|totally-fake|not-a-real|synthetic|example|dummy|placeholder)''',
    # The PKCS#11 PIN fixture value used by the scrub-gate test (literal "fake").
    '''PKCS11_PIN=\d*fake''',
]
paths = [
    '''ships-publicly-vs-never\.md''',     # documents the never-commit NAMES, no values
    '''README\.md''',
    '''(.*?)tests/fixtures/(.*?)\.example$''',
    # These two test modules deliberately embed FAKE secret-shaped fixtures to
    # exercise the scrub gate's BLOCK path; the fakes are verified non-real by the
    # `fake`/`synthetic`/`hunter2` markers above. Allowlisting the files keeps CI
    # green without weakening detection of REAL secrets elsewhere in the tree.
    '''tests/test_secret_scrub\.py''',
    '''tests/test_keycustody\.py''',
    # The scrub script itself documents the secret NAMES it scans for (no values).
    '''scripts/pre_publish_secret_scrub\.py''',
]
