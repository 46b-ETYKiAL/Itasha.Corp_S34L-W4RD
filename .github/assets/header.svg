<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 548" width="1280" height="548" role="img" aria-label="S34L-W4RD cross-platform code-signing orchestrator: a CRT bezel with phosphor scanlines and a hexagonal cryptographic seal stamped over concentric warding rings, five platform sigils orbiting, and a verify-after-sign pulse. Keys never live here.">
  <defs>
    <pattern id="scan" patternUnits="userSpaceOnUse" width="1280" height="4">
      <rect width="1280" height="2" fill="transparent"/><rect y="2" width="1280" height="2" fill="rgba(0,0,0,0.16)"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="48%" r="72%">
      <stop offset="0%" stop-color="transparent"/><stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </radialGradient>
    <radialGradient id="sealcore" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/><stop offset="60%" stop-color="#a020ff" stop-opacity="0.14"/><stop offset="100%" stop-color="#a020ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wardgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/><stop offset="55%" stop-color="#a020ff"/><stop offset="100%" stop-color="#e020ff"/>
    </linearGradient>
    <filter id="phos"><feGaussianBlur in="SourceGraphic" stdDeviation="0.7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sealglow"><feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="sc"><rect x="28" y="22" width="1224" height="501" rx="6"/></clipPath>
    <radialGradient id="glass" cx="36%" cy="22%" r="62%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="55%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <pattern id="phosmask" width="3" height="1" patternUnits="userSpaceOnUse"><rect width="1" height="1" x="0" fill="#ff2a2a"/><rect width="1" height="1" x="1" fill="#2aff2a"/><rect width="1" height="1" x="2" fill="#2a2aff"/></pattern>
  </defs>
  <style>
    text { font-family: "JetBrains Mono","SF Mono","Fira Code","Cascadia Code",Consolas,monospace; }
    @keyframes sweep { 0% { transform: translateY(0); } 100% { transform: translateY(501px); } }
    @keyframes flicker { 0%,96%,100% { opacity: 1; } 97% { opacity: 0.97; } 98% { opacity: 0.995; } }
    @keyframes bootReveal { 0% { opacity: 0; } 100% { opacity: 0.92; } }
    @keyframes curBlink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    @keyframes heartbeat { 0%,100% { transform: scale(1); opacity: 0.55; } 15% { transform: scale(1.3); opacity: 0.95; } 30% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(1.1); opacity: 0.8; } }
    @keyframes edgeGlow { 0% { stroke-dashoffset: 3450; } 100% { stroke-dashoffset: 0; } }
    @keyframes phosphorBloom { 0%,100% { opacity: 0; } 50% { opacity: 0.02; } }
    @keyframes kanjiPulse { 0%,100% { opacity: 0.1; } 50% { opacity: 0.2; } }
    @keyframes rollBar { 0% { transform: translateY(-70px); } 100% { transform: translateY(540px); } }
    @keyframes dataBlink { 0%,100% { opacity: 0.12; } 50% { opacity: 0.7; } }
    @keyframes titleGlitch { 0%,90%,100% { transform: translate(0,0); } 91% { transform: translate(-2px,1px); } 94% { transform: translate(2px,-1px); } 97% { transform: translate(-1px,0); } }
    @keyframes okPulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes linePulse { 0%,100% { opacity: 0.8; } 50% { opacity: 1; } }
    @keyframes titleBreathe { 0%,100% { opacity: 1; } 50% { opacity: 0.85; } }
    @keyframes crtBlank { 0%,90% { opacity: 0; } 91.5% { opacity: 1; } 97% { opacity: 1; } 98.6% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes crtLine { 0%,89.5% { opacity: 0; transform: scaleY(1); } 90.4% { opacity: 0.95; transform: scaleY(0.03); } 91.4% { opacity: 0; transform: scaleY(0.01); } 97.4% { opacity: 0; transform: scaleY(0.02); } 98.2% { opacity: 0.95; transform: scaleY(0.08); } 99.2% { opacity: 0; transform: scaleY(1); } 100% { opacity: 0; } }
    @keyframes wardSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes wardSpinRev { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
    @keyframes sealStamp { 0%,72% { opacity: 0; transform: scale(1.5); } 78% { opacity: 1; transform: scale(0.94); } 82% { transform: scale(1.05); } 88%,100% { opacity: 1; transform: scale(1); } }
    @keyframes verifyPulse { 0% { r: 92; opacity: 0.5; } 100% { r: 150; opacity: 0; } }
    @keyframes orbitGlow { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
    @keyframes checkDraw { 0%,74% { stroke-dashoffset: 60; } 86%,100% { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect x="0" y="0" width="1280" height="548" rx="14" fill="#0b0f12"/>
  <rect x="2" y="2" width="1276" height="544" rx="13" fill="#16121f" stroke="#2a2440" stroke-width="1"/>
  <line x1="24" y1="13" x2="1256" y2="13" stroke="#2a2440" stroke-width="0.5"/>
  <line x1="24" y1="529" x2="1256" y2="529" stroke="#2a2440" stroke-width="0.5"/>
  <rect x="28" y="22" width="1224" height="501" rx="6" fill="#08060d"/>

  <g clip-path="url(#sc)">
    <g stroke="#a020ff" stroke-width="0.5" opacity="0.18">
      <line x1="120" y1="430" x2="1160" y2="430"/><line x1="80" y1="476" x2="1200" y2="476"/><line x1="48" y1="514" x2="1232" y2="514"/>
    </g>
    <g fill="#00e5ff">
      <circle cx="360" cy="470" r="1.6" style="animation: dataBlink 2.6s ease-in-out 0s infinite;"/>
      <circle cx="700" cy="502" r="1.6" style="animation: dataBlink 3.1s ease-in-out 0.8s infinite;"/>
      <circle cx="980" cy="452" r="1.6" fill="#e020ff" style="animation: dataBlink 2.4s ease-in-out 1.4s infinite;"/>
      <circle cx="498" cy="510" r="1.6" fill="#a020ff" style="animation: dataBlink 3.4s ease-in-out 2s infinite;"/>
    </g>
    <rect x="28" y="22" width="1224" height="46" fill="#9f7fe8" opacity="0.03" style="animation: rollBar 7s linear infinite;"/>
    <rect x="28" y="22" width="1224" height="3" fill="#00e5ff" opacity="0.05" style="animation: sweep 9s linear infinite;"/>
    <rect x="28" y="22" width="1224" height="501" fill="#ffffff" opacity="0" style="animation: phosphorBloom 8s ease-in-out infinite;"/>

    <g transform="translate(996, 272)" style="animation: flicker 9s infinite;">
      <circle cx="0" cy="0" r="120" fill="url(#sealcore)"/>
      <circle cx="0" cy="0" r="92" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.4" style="animation: verifyPulse 3.2s ease-out infinite;"/>
      <circle cx="0" cy="0" r="92" fill="none" stroke="#e020ff" stroke-width="1" opacity="0.4" style="animation: verifyPulse 3.2s ease-out 1.6s infinite;"/>
      <g style="animation: wardSpin 26s linear infinite; transform-origin: 0px 0px;">
        <circle cx="0" cy="0" r="104" fill="none" stroke="#a020ff" stroke-width="0.8" opacity="0.45" stroke-dasharray="2,6"/>
        <circle cx="0" cy="0" r="96" fill="none" stroke="#00e5ff" stroke-width="0.6" opacity="0.3"/>
      </g>
      <g style="animation: wardSpinRev 18s linear infinite; transform-origin: 0px 0px;">
        <circle cx="0" cy="0" r="84" fill="none" stroke="#e020ff" stroke-width="0.7" opacity="0.4" stroke-dasharray="1,9"/>
      </g>
      <g font-size="9" letter-spacing="1" text-anchor="middle" filter="url(#phos)">
        <g style="animation: orbitGlow 3s ease-in-out 0s infinite;"><circle cx="0" cy="-104" r="9" fill="#08060d" stroke="#00e5ff" stroke-width="1"/><text x="0" y="-101" fill="#00e5ff" font-size="7">WIN</text></g>
        <g style="animation: orbitGlow 3s ease-in-out 0.6s infinite;"><circle cx="99" cy="-32" r="9" fill="#08060d" stroke="#a020ff" stroke-width="1"/><text x="99" y="-29" fill="#a020ff" font-size="7">MAC</text></g>
        <g style="animation: orbitGlow 3s ease-in-out 1.2s infinite;"><circle cx="61" cy="84" r="9" fill="#08060d" stroke="#e020ff" stroke-width="1"/><text x="61" y="87" fill="#e020ff" font-size="7">LIN</text></g>
        <g style="animation: orbitGlow 3s ease-in-out 1.8s infinite;"><circle cx="-61" cy="84" r="9" fill="#08060d" stroke="#00e5ff" stroke-width="1"/><text x="-61" y="87" fill="#00e5ff" font-size="7">AND</text></g>
        <g style="animation: orbitGlow 3s ease-in-out 2.4s infinite;"><circle cx="-99" cy="-32" r="9" fill="#08060d" stroke="#a020ff" stroke-width="1"/><text x="-99" y="-29" fill="#a020ff" font-size="7">IOS</text></g>
      </g>
      <g filter="url(#sealglow)" style="animation: sealStamp 6s ease-out infinite; transform-origin: 0px 0px;">
        <polygon points="0,-66 57,-33 57,33 0,66 -57,33 -57,-33" fill="#08060d" stroke="url(#wardgrad)" stroke-width="2.4"/>
        <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.5"/>
        <path d="M-30 6 q8 -22 16 0 t16 0 t14 -4" fill="none" stroke="#e020ff" stroke-width="1.6" opacity="0.85"/>
        <path d="M-16 -6 l10 12 l22 -26" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" style="animation: checkDraw 6s ease-out infinite;"/>
      </g>
      <text x="0" y="104" text-anchor="middle" font-size="8" letter-spacing="3" fill="#7a6ba8" opacity="0.7">SIGN WARD VERIFY</text>
    </g>

    <g filter="url(#phos)">
      <text x="64" y="222" font-size="12" fill="#5a4f73">sealward sign --config signing.toml</text>
      <text x="84" y="250" font-size="12.5" fill="#00e5ff" style="animation: bootReveal 0.35s ease-out 0.2s both, linePulse 3.6s ease-in-out 0.0s infinite;">&gt; resolve key HANDLE (pkcs11 cng kms)</text>
      <text x="540" y="250" font-size="12.5" fill="#6fe0c0" style="animation: bootReveal 0.35s ease-out 0.2s both, okPulse 2s ease-in-out 0.6s infinite;">[ OK ]</text>
      <text x="84" y="276" font-size="12.5" fill="#00e5ff" style="animation: bootReveal 0.35s ease-out 0.5s both, linePulse 3.6s ease-in-out 0.4s infinite;">&gt; sign authenticode codesign gpg</text>
      <text x="540" y="276" font-size="12.5" fill="#6fe0c0" style="animation: bootReveal 0.35s ease-out 0.5s both, okPulse 2s ease-in-out 1.0s infinite;">[ OK ]</text>
      <text x="84" y="302" font-size="12.5" fill="#00e5ff" style="animation: bootReveal 0.35s ease-out 0.8s both, linePulse 3.6s ease-in-out 0.8s infinite;">&gt; sign apksigner fastlane-match</text>
      <text x="540" y="302" font-size="12.5" fill="#6fe0c0" style="animation: bootReveal 0.35s ease-out 0.8s both, okPulse 2s ease-in-out 1.4s infinite;">[ OK ]</text>
      <text x="84" y="328" font-size="12.5" fill="#00e5ff" style="animation: bootReveal 0.35s ease-out 1.1s both, linePulse 3.6s ease-in-out 1.2s infinite;">&gt; verify-after-sign every artifact</text>
      <text x="540" y="328" font-size="12.5" fill="#6fe0c0" style="animation: bootReveal 0.35s ease-out 1.1s both, okPulse 2s ease-in-out 1.8s infinite;">[ OK ]</text>
      <text x="84" y="354" font-size="12.5" fill="#00e5ff" style="animation: bootReveal 0.35s ease-out 1.4s both, linePulse 3.6s ease-in-out 1.6s infinite;">&gt; provenance sigstore sbom slsa</text>
      <text x="540" y="354" font-size="12.5" fill="#6fe0c0" style="animation: bootReveal 0.35s ease-out 1.4s both, okPulse 2s ease-in-out 2.2s infinite;">[ OK ]</text>
      <text x="64" y="382" font-size="12" fill="#5a4f73">--------------------------------------------</text>
      <text x="64" y="416" font-size="13" fill="#e020ff" opacity="0.9">keys never live here<tspan dx="10" fill="#5a4f73">handles only</tspan></text>
      <text x="64" y="444" font-size="13" fill="#6fe0c0">root@itasha:seal$<tspan dx="6" fill="#00e5ff" style="animation: curBlink 1.1s step-end infinite;">_</tspan></text>
    </g>
  </g>
  <rect x="28" y="22" width="1224" height="501" rx="6" fill="url(#scan)"/>
  <rect x="28" y="22" width="1224" height="501" rx="6" fill="url(#vig)"/>
  <rect x="28" y="22" width="1224" height="501" rx="6" fill="url(#phosmask)" opacity="0.04"/>
  <rect x="28" y="22" width="1224" height="501" rx="6" fill="url(#glass)"/>
  <rect x="28" y="22" width="1224" height="501" rx="6" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.07" stroke-dasharray="22,3428" style="animation: edgeGlow 11s linear infinite;"/>
  <rect x="28" y="22" width="1224" height="501" rx="6" fill="none" stroke="#2a2440"/>

  <g stroke="#a020ff" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M56 54 h26 M56 54 v26"/><path d="M1224 54 h-26 M1224 54 v26"/>
    <path d="M56 491 h26 M56 491 v-26"/><path d="M1224 491 h-26 M1224 491 v-26"/>
  </g>

  <text x="1204" y="98" text-anchor="end" font-size="40" fill="#9f7fe8" opacity="0.13" font-family="Noto Sans JP,Yu Gothic,Hiragino Sans,sans-serif" style="animation: kanjiPulse 6s ease-in-out infinite;">封印</text>
  <g style="animation: flicker 7s infinite;">
    <text x="640" y="74" text-anchor="middle" font-size="13" fill="#5a4f73" letter-spacing="7" filter="url(#phos)" style="font-family: Times New Roman,Times,serif; font-weight: 700; transform: scaleX(0.82); transform-origin: 640px 74px; animation: titleBreathe 6s ease-in-out infinite;">I T A S H A . C O R P</text>
    <g font-size="60" font-weight="bold" letter-spacing="6" text-anchor="middle">
      <text x="643" y="140" fill="#a020ff" opacity="0.5" filter="url(#soft)" style="animation: titleGlitch 5.5s steps(1) infinite; transform-origin: 640px 140px;">S34L-W4RD</text>
      <text x="637" y="140" fill="#00e5ff" opacity="0.5" filter="url(#soft)" style="animation: titleGlitch 6.3s steps(1) 0.1s infinite; transform-origin: 640px 140px;">S34L-W4RD</text>
      <text x="640" y="140" fill="#e9f7ff" filter="url(#glow)" style="animation: titleBreathe 4s ease-in-out infinite;">S34L-W4RD</text>
    </g>
    <text x="640" y="172" text-anchor="middle" font-size="14" fill="#9f7fe8" letter-spacing="3" filter="url(#phos)">sign every platform from one config - keys never live here</text>
  </g>

  <g>
    <circle cx="56" cy="536" r="3.5" fill="#6fe0c0" opacity="0.7" style="animation: heartbeat 2.4s ease-in-out infinite; transform-origin: 56px 536px;"/>
    <circle cx="71" cy="536" r="3" fill="#00e5ff" opacity="0.45"/>
    <circle cx="86" cy="536" r="3" fill="#a020ff" opacity="0.4"/>
    <text x="108" y="536" font-size="9" fill="#4a4263" letter-spacing="3.2" dominant-baseline="central">ITASHA.CORP</text>
    <text x="640" y="536" font-size="9" fill="#4a4263" letter-spacing="3" dominant-baseline="central" text-anchor="middle">SEAL-WARD cross-platform code signer</text>
    <text x="1208" y="536" font-size="9" fill="#4a4263" letter-spacing="2.4" dominant-baseline="central" text-anchor="end">CRT-IC v2</text>
    <circle cx="1224" cy="536" r="4" fill="#6fe0c0" opacity="0.5"/>
    <circle cx="1224" cy="536" r="2" fill="#6fe0c0" opacity="0.95" style="animation: heartbeat 2.4s ease-in-out infinite; transform-origin: 1224px 536px;"/>
  </g>
  <rect x="28" y="22" width="1224" height="501" rx="6" fill="#050608" opacity="0" style="animation: crtBlank 14s ease-in-out infinite;"/>
  <rect x="28" y="271.0" width="1224" height="3" fill="#e9f7ff" opacity="0" style="animation: crtLine 14s ease-in-out infinite; transform-origin: 640px 272.5px;"/>
</svg>
